[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-forge"
version = "0.1.0"
description = "Document to Academic Paper PDF Converter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fpdf2>=2.7.0",
  "jinja2>=3.1.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "openai>=1.0.0",
  "Pillow>=9.0.0",
  "pypdf>=5.0.0",
  "pyyaml>=6.0",
  "requests>=2.28.0",
  "gradio>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["paper_forge"]
py-modules = ["app"]
